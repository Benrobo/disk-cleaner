[package]
name = "disk-cleaner"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
plist = "1.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tao = "0.37.1"
trash = "5.2.9"
tray-icon = "0.26.1"
window-vibrancy = "0.8.1"
wry = "0.57.0"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
